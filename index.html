<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070807" />
    <meta name="application-name" content="Case" />
    <meta name="apple-mobile-web-app-title" content="Case" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Opened from the iPhone home screen: full screen, no Safari chrome, the
         status bar drawn over the app's own dark ground. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- viewport-fit=cover lets the page run under the notch and the home
         indicator; src/mobile.css pads the edges back with env(safe-area-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- The three faces (Geist, Geist Mono, Instrument Serif) are bundled with
         the app; see the imports at the top of src/main.jsx. -->

    <title>Case</title>

    <!-- The ground, before the stylesheet has arrived: without it the first
         frame on a phone is the browser's white, for as long as the CSS takes
         over the network. Near enough every accent's own --bg to pass. -->
    <meta name="color-scheme" content="dark" />
    <style>html, body { background: #070807; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
