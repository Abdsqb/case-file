<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -32 64 64" width="64" height="64">
  <!-- Same geometry as the in-app <Logo>: a rounded-hexagon pebble, outlined,
       with one lobe filled across a diagonal cut. -->
  <rect x="-32" y="-32" width="64" height="64" fill="#000000"/>
  <defs>
    <clipPath id="lobe">
      <polygon points="-32,-32 6,-32 -9,32 -32,32"/>
    </clipPath>
  </defs>
  <path id="pebble"
        d="M -22 -7 A 15 15 0 0 1 -7 -22 L 7 -22 A 15 15 0 0 1 22 -7 L 22 7 A 15 15 0 0 1 7 22 L -7 22 A 15 15 0 0 1 -22 7 Z"
        fill="none" stroke="#EDEDED" stroke-width="4" stroke-linejoin="round"/>
  <use href="#pebble" fill="#EDEDED" stroke="none" clip-path="url(#lobe)"/>
</svg>
